<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reto 5 </title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="layout-principal">
        <header class="barra-superior">
            <div class="logo">Dashboard</div>
        </header>

        <nav class="menu-lateral">

                <li class="activo">Inicio</li>
                <li>Reportes</li>
                <li>Usuarios</li>
                <li>Productos</li>
            </ul>
        </nav>

        <main class="seccion-contenido">
            <div class="tarjeta azul">
                <div class="encabezado">Ventas</div>
                <div class="cuerpo">
                    <div class="valor">1,234</div>
                </div>
                <div class="barra"></div>
            </div>

            <div class="tarjeta morada">
                <div class="encabezado">Usuarios</div>
                <div class="cuerpo">
                    <div class="valor">567</div>
                </div>
                <div class="barra"></div>
            </div>

            <div class="tarjeta naranja">
                <div class="encabezado">Pedidos</div>
                <div class="cuerpo">
                    <div class="valor">89</div>
                </div>
                <div class="barra"></div>
            </div>
        </main>

        <footer class="footer">
            © 2026 Mateo Risotto
        </footer>
    </div>
</body>
</html>
